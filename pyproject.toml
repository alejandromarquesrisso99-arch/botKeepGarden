[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepgarden"
version = "0.1.0"
description = "Un jardín de bots de trading: nacen, se fusionan, evolucionan y mueren sobre datos reales"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Alex" }]

dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
# Salida bonita en la terminal. Opcional a propósito: la CLI funciona sin ella.
pretty = ["rich>=13.7"]

[project.scripts]
keepgarden = "keepgarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keepgarden = ["storage/*.sql", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests que tardan (backtests largos, fuzz masivo)",
    "network: tests que necesitan salir a internet",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # la longitud la controla el formateador
    "B905",    # zip(strict=) no siempre aporta aquí
]

[tool.mypy]
python_version = "3.11"
packages = ["keepgarden"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# El código financiero es donde un None inesperado hace más daño.
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["ccxt.*", "pyarrow.*"]
ignore_missing_imports = true
