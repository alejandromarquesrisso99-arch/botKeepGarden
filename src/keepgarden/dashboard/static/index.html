<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>botKeepGarden</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- ECharts desde CDN: sin build, sin node_modules. Con un espejo detrás por
       si el primero está bloqueado, y si no hay red el front sigue funcionando:
       las tablas se pintan igual y cada gráfico avisa en su hueco. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
  <script>
    if (!window.echarts) {
      document.write(
        '<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"><\/script>'
      );
    }
  </script>
</head>
<body>
  <header class="topbar">
    <h1>botKeepGarden</h1>
    <nav id="nav">
      <button data-view="garden"   class="active">Jardín</button>
      <button data-view="lineage">Genealogía</button>
      <button data-view="breeding">Cría</button>
      <button data-view="generations">Generaciones</button>
      <button data-view="species">Especies</button>
      <button data-view="journal">Diario</button>
      <button data-view="health">Salud</button>
    </nav>
    <button id="live" class="live" type="button">● en vivo</button>
    <div id="status" class="status"></div>
  </header>

  <main>
    <section id="view-garden"      class="view active"></section>
    <section id="view-lineage"     class="view"></section>
    <section id="view-breeding"    class="view"></section>
    <section id="view-generations" class="view"></section>
    <section id="view-species"     class="view"></section>
    <section id="view-journal"     class="view"></section>
    <section id="view-health"      class="view"></section>
    <section id="view-bot"         class="view"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
